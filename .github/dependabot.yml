version: 2

# Every npm entry groups BOTH minor/patch and major updates.
#
# A group that only covers minor and patch still lets every major bump open
# its own PR — on a fresh repo that is one PR per outdated major, which is how
# this config produced eighteen at once. Majors are batched into a second
# group instead: they are the ones that need a human reading changelogs, so
# they should arrive as one deliberate review per package, not as a queue.

updates:
  # Root workspace manifest. pnpm workspaces are covered by the root entry
  # plus one directory entry per workspace package below.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    versioning-strategy: increase
    groups:
      root-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      root-major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # Workspace-internal packages are versioned by the release workflow.
      - dependency-name: "@pingus/*"

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    versioning-strategy: increase
    groups:
      web-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      web-major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      - dependency-name: "@pingus/*"

  - package-ecosystem: npm
    directory: /packages/core
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      core-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      core-major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      - dependency-name: "@pingus/*"

  - package-ecosystem: npm
    directory: /packages/pingu-render
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      render-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      render-major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      - dependency-name: "@pingus/*"

  # Hardhat, its plugins, typechain and ethers move as one unit — a partial
  # bump of that set does not install, let alone compile.
  - package-ecosystem: npm
    directory: /packages/contracts
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      hardhat-toolchain:
        patterns:
          - "hardhat*"
          - "@nomicfoundation/*"
          - "@typechain/*"
          - "typechain"
          - "ethers"
      contracts-rest:
        patterns: ["*"]
        exclude-patterns:
          - "hardhat*"
          - "@nomicfoundation/*"
          - "@typechain/*"
          - "typechain"
          - "ethers"
    ignore:
      - dependency-name: "@pingus/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
